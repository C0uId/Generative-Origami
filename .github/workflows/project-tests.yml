name: project-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt
          pip install -e .
      - name: Core regression
        run: PYTHONPATH=src:. python -m unittest discover -s tests/core -v
      - name: Q4 regression
        run: PYTHONPATH=src:research/q4_b01:. python -m unittest discover -s tests/q4_b01 -v
