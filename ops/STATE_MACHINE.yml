schema_version: state-1.0
states:
  - BACKLOG
  - READY
  - IN_PROGRESS
  - READY_FOR_REVIEW
  - REVIEWING
  - REVISE
  - PASS
  - ESCALATE
  - HALT
transitions:
  BACKLOG: [READY]
  READY: [IN_PROGRESS]
  IN_PROGRESS: [READY_FOR_REVIEW, ESCALATE, HALT]
  READY_FOR_REVIEW: [REVIEWING]
  REVIEWING: [PASS, REVISE, ESCALATE, HALT]
  REVISE: [IN_PROGRESS]
  PASS: [READY]
owner_notification:
  notify_on: [ESCALATE, HALT]
escalation_rules:
  consecutive_revise_limit: 3
  no_improvement_experiment_limit: 5
